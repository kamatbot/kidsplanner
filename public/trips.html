<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1efec">
  <title>Trips — Fam ETC</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('fam_theme');
        var t = raw ? JSON.parse(raw) : null;
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* localStorage unavailable — default light */ }
    })();
  </script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/horizon.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/trips.css">
</head>
