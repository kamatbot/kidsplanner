<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security &amp; Passkeys — Fam ETC</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/horizon.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <a href="/" style="text-decoration:none;display:flex;align-items:center;gap:10px">
        <span class="app-logo">🗂️</span>
        <span class="app-name">Fam ETC</span>
      </a>
    </div>
    <div class="header-right">
      <a href="/" style="color:var(--accent);font-weight:800;text-decoration:none">← Back to app</a>
    </div>
  </header>

  <main class="static-page">
    <h1>Security &amp; Passkeys</h1>

    <section class="card" style="margin:20px 0;padding:24px">
      <h3 style="margin-bottom:14px">Your passkeys</h3>
      <div id="credentials-list"></div>
      <form id="add-passkey-form" style="margin-top:18px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
        <div class="form-group" style="margin:0;flex:1;min-width:180px">
          <label>Label (optional)</label>
          <input type="text" id="new-passkey-label" placeholder="My laptop">
        </div>
        <button type="submit" class="btn-primary">+ Add a passkey</button>
      </form>
      <div id="passkey-error" class="error-msg"></div>
    </section>

    <section class="card" style="margin:20px 0;padding:24px">
      <h3 style="margin-bottom:14px">Account Recovery &amp; Backup Codes</h3>
      <p class="text-muted" style="margin-bottom:14px">Backup codes let you sign in to Fam ETC on new devices (such as Android or Windows) or if you lose access to all your passkeys. Regenerating replaces any existing codes with 10 fresh single-use codes.</p>
      <button class="btn-primary" id="regen-backup-btn" onclick="handleRegenerateBackupCodes()">🔑 Generate backup codes</button>
      <div id="backup-codes-output" style="margin-top:14px"></div>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function renderCredentials() {
      const list = document.getElementById('credentials-list');
      try {
        const creds = await window.auth.getCredentials();
        if (!creds.length) {
          list.innerHTML = '<p class="text-muted">No passkeys yet.</p>';
          return;
        }
        list.innerHTML = creds.map((c) => `
          <div class="upload-item" style="justify-content:space-between">
            <span>🔑</span>
            <span class="upload-item-name" style="cursor:default">${esc(c.name)} ${c.lastUsed ? '· last used ' + esc(new Date(c.lastUsed).toLocaleDateString()) : ''}</span>
            <button class="upload-delete-btn" style="opacity:1" onclick="handleRemoveCredential('${c.id}')" title="Remove passkey">×</button>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<p class="error-msg">${esc(err.message)}</p>`;
      }
    }

    async function handleRemoveCredential(id) {
      try {
        await window.auth.removeCredential(id);
        renderCredentials();
      } catch (err) {
        document.getElementById('passkey-error').textContent = err.message;
      }
    }

    document.getElementById('add-passkey-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const label = document.getElementById('new-passkey-label').value.trim();
      const errEl = document.getElementById('passkey-error');
      errEl.textContent = '';
      try {
        await window.auth.registerAdditionalPasskey(label);
        document.getElementById('new-passkey-label').value = '';
        renderCredentials();
      } catch (err) {
        errEl.textContent = err.message;
      }
    });

    let generatedCodes = [];
    async function handleRegenerateBackupCodes() {
      const out = document.getElementById('backup-codes-output');
      const btn = document.getElementById('regen-backup-btn');
      try {
        const res = await window.auth.regenerateBackupCodes();
        const codes = (res && res.backupCodes) || [];
        generatedCodes = codes;
        btn.textContent = '🔄 Regenerate backup codes';
        out.innerHTML = `
          <div style="background:var(--card-bg, #ffffff);border:1.5px solid var(--accent, #5856D6);border-radius:var(--radius-md, 12px);padding:18px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
              <div>
                <div style="font-weight:800;font-size:15px">Save these recovery codes</div>
                <div class="text-muted" style="font-size:12px">Shown only once. Use them to sign in on Android or if you lose your device.</div>
              </div>
              <button type="button" class="btn-primary" onclick="copyBackupCodes()" style="font-size:12px;padding:6px 14px">
                📋 Copy all codes
              </button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:8px;background:var(--bg, #F2F2F7);padding:14px;border-radius:8px;font-family:monospace;font-weight:700;font-size:14px">
              ${codes.map((c) => `<div style="background:var(--card-bg, #fff);padding:8px 10px;border-radius:6px;text-align:center;border:1px solid rgba(0,0,0,0.06)">${esc(c)}</div>`).join('')}
            </div>
          </div>`;
      } catch (err) {
        out.innerHTML = `<p class="error-msg">${esc(err.message)}</p>`;
      }
    }

    function copyBackupCodes() {
      if (!generatedCodes.length) return;
      const text = generatedCodes.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          alert('10 backup codes copied to clipboard!');
        }).catch(() => {
          prompt('Copy your backup codes:', text);
        });
      } else {
        prompt('Copy your backup codes:', text);
      }
    }

    renderCredentials();
  </script>
</body>
</html>
