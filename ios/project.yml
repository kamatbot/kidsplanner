name: FamETC
options:
  bundleIdPrefix: com.fametc
  deploymentTarget:
    # "latest major minus 1" per APP-BRIEF.md. RetireOdds (built ~mid-2026)
    # targeted 17.0; picking 18.0 here as the "N-1" floor. Confirm/adjust
    # against whatever iOS major is actually current when Xcode is opened —
    # this is a placeholder judgment call, not a hard requirement.
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    # Apple Developer Team ID — matches IOS_APP_IDS on the server
    # (B4F73U5RGR.com.fametc.app, see .env.example). Same Apple account as
    # RetireOdds, unchanged per APP-BRIEF.md.
    DEVELOPMENT_TEAM: "B4F73U5RGR"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # Shared secret that identifies the native app to the server's iOS free-tier
    # gate (must equal the server's IOS_CLIENT_SECRET env var). Surfaced to the
    # app via the FAMIOSClientKey Info.plist entry. Empty default = legacy
    # behavior (works while the server's IOS_CLIENT_SECRET is unset). Set the
    # real value locally — do NOT commit it (e.g. override in a gitignored
    # xcconfig or your build environment). Use only UA-safe chars (hex / base64url).
    FAM_IOS_CLIENT_KEY: ""

targets:
  FamETC:
    type: application
    platform: iOS
    sources:
      - path: FamETC
    dependencies:
      - target: FamETCParentWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fametc.app
        PRODUCT_NAME: FamETC
        INFOPLIST_FILE: FamETC/Info.plist
        CODE_SIGN_ENTITLEMENTS: FamETC/FamETC.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  FamETCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FamETCTests
    dependencies:
      - target: FamETC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fametc.app.tests
        GENERATE_INFOPLIST_FILE: YES
  FamETCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FamETCUITests
    dependencies:
      - target: FamETC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fametc.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FamETC

  FamETCWatch:
    type: application
    platform: watchOS
    sources:
      - path: FamETCWatch
      - path: FamETCWatchShared
    dependencies:
      - target: FamETCWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fametc.watch
        PRODUCT_NAME: FamETCWatch
        INFOPLIST_FILE: FamETCWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Fam ETC"
        INFOPLIST_KEY_FAMIOSClientKey: "$(FAM_IOS_CLIENT_KEY)"
        INFOPLIST_KEY_WKWatchOnly: YES
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        CODE_SIGN_ENTITLEMENTS: FamETCWatch/FamETCWatch.entitlements

  FamETCWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: FamETCWatchWidget
      - path: FamETCWatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fametc.watch.widget
        PRODUCT_NAME: FamETCWatchWidget
        INFOPLIST_FILE: FamETCWatchWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Fam ETC"
        CODE_SIGN_ENTITLEMENTS: FamETCWatchWidget/FamETCWatchWidget.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "11.0"

  FamETCWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: FamETCWatchTests
    dependencies:
      - target: FamETCWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fametc.watch.tests
        GENERATE_INFOPLIST_FILE: YES

  FamETCParentWatch:
    type: application
    platform: watchOS
    sources:
      - path: FamETCWatch
      - path: FamETCWatchShared
    dependencies:
      - target: FamETCParentWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fametc.app.watch
        PRODUCT_NAME: FamETCParentWatch
        INFOPLIST_FILE: FamETCWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Fam ETC"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.fametc.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_FAMIOSClientKey: "$(FAM_IOS_CLIENT_KEY)"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        CODE_SIGN_ENTITLEMENTS: FamETCWatch/FamETCWatch.entitlements
  FamETCParentWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: FamETCWatchWidget
      - path: FamETCWatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fametc.app.watch.widget
        PRODUCT_NAME: FamETCParentWatchWidget
        INFOPLIST_FILE: FamETCWatchWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Fam ETC"
        CODE_SIGN_ENTITLEMENTS: FamETCWatchWidget/FamETCWatchWidget.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
