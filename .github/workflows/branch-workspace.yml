name: Branch workspace snapshot
on:
  push:
    branches: [feature/web-media-performance-family-ux]
    paths: [.github/workflows/branch-workspace.yml]
permissions:
  contents: read
concurrency:
  group: fametc-branch-workspace
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm ci --no-audit --no-fund
      - name: Recover tracked milestone source and locked test dependencies
        run: |
          mkdir -p /tmp/fametc-workspace
          git archive HEAD | tar -x -C /tmp/fametc-workspace
          cp -a node_modules /tmp/fametc-workspace/
          tar -czf /tmp/fametc-workspace.tgz -C /tmp/fametc-workspace .
      - uses: actions/upload-artifact@v4
        with:
          name: fametc-branch-workspace
          path: /tmp/fametc-workspace.tgz
          retention-days: 1
