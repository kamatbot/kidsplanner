name: CI

on:
  pull_request:
    # Draft updates skip the job below. Once ready, every new head is checked;
    # concurrency cancellation prevents superseded heads from consuming runners.
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fametc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
